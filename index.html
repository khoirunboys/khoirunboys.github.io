<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Khoirunboys</title>
<link rel="stylesheet" href="style.css">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f0f6ff;
        }

        nav {
            background: white;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
        }

        nav h2 {
            color: #2563eb;
            margin: 0;
        }

        nav a {
            text-decoration: none;
            color: #333;
            margin-left: 20px;
        }

        .home {
            text-align: center;
            padding: 120px 20px;
        }

        .home h1 {
            font-size: 40px;
            color: #1e40af;
        }

        .home p {
            font-size: 18px;
            color: #555;
        }

        button {
            background: #2563eb;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <nav>
        <h2>Khoirunboys</h2>

        <div>
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#contact">Contact</a>
        </div>
    </nav>

    <section class="home" id="home">
        <h1>Selamat Datang!</h1>

        <p>
            Selamat datang di website Khoirunboys.
        </p>

        <button onclick="alert('Selamat datang!')">
            Mulai
        </button>
    </section>

    <section id="about" style="text-align:center;padding:30px">
        <h2>Tentang Saya</h2>
        <p>Ini adalah website pribadi saya.</p>
    </section>

    <section id="contact" style="text-align:center;padding:30px">
        <h2>Kontak</h2>
        <p>Terima kasih sudah mengunjungi website saya.</p>
    </section>

</body>
</html>
